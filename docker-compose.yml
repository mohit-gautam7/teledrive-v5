# Always-on deployment (Oracle Cloud Always Free ARM, or any small VM).
#
# The whole stack is here: Postgres, the app, Caddy for TLS, and a nightly
# dump. One `docker compose up -d --build` on a bare VM is the entire recovery
# procedure — see BACKUP.md.
#
#   cp .env.example .env    # fill it in
#   docker compose up -d --build
#
# The database is in this file on purpose. It used to be a managed free tier,
# which paused itself after seven days of inactivity and took the whole drive
# offline — the files were never at risk, but the index that finds them was
# unreachable until someone clicked Restore. A container on the same box has no
# such policy. To go back to a managed database instead, set DATABASE_URL in
# .env to point at it and remove the `db` service and the `depends_on` below.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teledrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-teledrive}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Postgres runs everything in this directory exactly once, when the data
      # directory is first created — so a brand-new volume comes up with the
      # schema already in place and the app does not spend its first minutes
      # logging `relation "User" does not exist`. An existing volume is
      # untouched, which is what makes this safe to leave mounted forever.
      - ./scripts/init-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    # Deliberately no `ports:`. The app and the dump reach it over the compose
    # network; nothing needs it from outside, and publishing 5432 on a cloud VM
    # is how a database ends up in someone else's dataset.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teledrive} -d ${POSTGRES_DB:-teledrive}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      # A long-lived process holds its own pool, so it does not need the
      # one-connection-per-request setting the serverless deployment required.
      NODE_ENV: production
      # Overrides whatever .env carries, so the app talks to the container above
      # rather than to a leftover managed URL someone forgot to remove.
      DATABASE_URL: postgresql://${POSTGRES_USER:-teledrive}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teledrive}
      # One box, one always-on process: it can drain its own job queue.
      JOB_WORKER_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    # Streaming a 2 GB file never buffers the whole thing, but Node still needs
    # headroom for concurrent chunk buffers.
    mem_limit: 2g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump into ./backups on the host, keeping BACKUP_KEEP_DAYS of them.
  #
  # A service rather than a host cron entry, so that "how do I restore this" and
  # "what makes the backups" are answered by the same file, and so a rebuilt VM
  # starts backing up again without anyone remembering to reinstall a crontab.
  # It is the same postgres image, so pg_dump always matches the server version.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-teledrive}
      POSTGRES_DB: ${POSTGRES_DB:-teledrive}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    # Custom format, so a single table can be restored without replaying
    # everything. Written to a .part file and renamed only on success: a dump
    # interrupted by a reboot must never be mistaken for a complete one.
    command: >
      sh -c '
      while true; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ);
        out="/backups/teledrive-$$ts.dump";
        if pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" --no-owner --no-acl -Fc -f "$$out.part"; then
          mv "$$out.part" "$$out";
          echo "[backup] wrote $$out ($$(stat -c %s "$$out") bytes)";
        else
          echo "[backup] FAILED at $$ts"; rm -f "$$out.part";
        fi;
        find /backups -name "teledrive-*.dump" -mtime +$$BACKUP_KEEP_DAYS -delete;
        sleep 86400;
      done'

volumes:
  db_data:
  caddy_data:
  caddy_config:
